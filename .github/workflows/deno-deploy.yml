name: Deno Deploy

on:
  push:
    branches-ignore:
      - dist/**
  workflow_dispatch:

jobs:
  deploy:
    uses: ubiquity/deno-deploy-workflow/.github/workflows/deno-deploy-reusable.yml@main
    with:
      project: permit2-allowance-ubq-fi
      deploy_platform: deno2
      entrypoint: serve.ts
      root: .deploy-root
      install_command: deno install
      build_command: |
        deno task build
        rm -rf .deploy-root
        mkdir -p .deploy-root/static
        cp -R static/. .deploy-root/static/
        cp serve.ts deno.json deno.lock .deploy-root/
      build_env: |
        SUPABASE_URL=$SUPABASE_URL
        SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
        FRONTEND_URL=https://permit2-allowance.ubq.fi
      runtime_env: |
        STATIC_DIR=static
      include: |
        static/**
      debug_fetch_fail: true
      required_env: |
        DENO_DEPLOY_TOKEN
        SUPABASE_URL
        SUPABASE_ANON_KEY
    secrets: inherit
